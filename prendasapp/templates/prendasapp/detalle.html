<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Detalle de la tienda</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .contenedor {
            width: 60%;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
        }

        .informacion {
            margin-top: 30px;
        }

        .informacion p {
            font-size: 18px;
        }

        .boton {
            display: inline-block;
            padding: 10px 15px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>

</head>

<body>

<div class="contenedor">

    <h1>👁️ Detalle de la prenda</h1>

    <div class="informacion">

        <p>
            <strong>ID:</strong>
            {{ prenda.id }}
        </p>

        <p>
            <strong>Título:</strong>
            {{ prenda.titulo }}
        </p>

        <p>
            <strong>Descripción:</strong>
            {{ prenda.descripcion }}
        </p>
        
        <p>
            <strong>Estado:</strong>
            
            {% if tarea.completada %}
            Disponible ✅
            {% else %}
            No disponible ❌
            {% endif %}
            
        </p>
        
        <p><strong>Imagen:</strong></p>
        {% if prenda.imagen %}
            <img src="{{ prenda.imagen.url }}" alt="{{ prenda.nombre }}" class="imagen-prenda">
        {% else %}
            <p><em>Sin imagen asignada</em></p>
        {% endif %}

    </div>

    <a href="{% url 'inicio' %}" class="boton">
        ← Volver al inicio
    </a>

</div>
</body>
</html>

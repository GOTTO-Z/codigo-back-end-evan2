<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Prenda - Gustavini</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0b1320;
            color: #e2e8f0;
            margin: 0;
            padding: 0;
        }

        .header {
            background-color: #060b14;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid #1e3150;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #ffffff;
        }

        .contenedor {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
            background-color: #152238;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #1e3150;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        h2 {
            margin-top: 0;
            color: #ffffff;
            text-align: center;
            margin-bottom: 30px;
            text-transform: uppercase;
            font-size: 20px;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
            color: #94a3b8;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            background-color: #0d1829;
            border: 1px solid #1e3150;
            border-radius: 4px;
            color: #ffffff;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #3b82f6;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            color: #e2e8f0;
        }

        .imagen-actual {
            margin-bottom: 20px;
            text-align: center;
            background-color: #0d1829;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #1e3150;
        }

        .imagen-actual img {
            max-width: 150px;
            border-radius: 4px;
            display: block;
            margin: 10px auto 0;
        }

        input[type="file"] {
            color: #94a3b8;
        }

        .botones {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            transition: background-color 0.3s;
        }

        .btn-guardar {
            background-color: #ffffff;
            color: #0b1320;
        }

        .btn-guardar:hover {
            background-color: #cbd5e1;
        }

        .btn-volver {
            background-color: #1e3150;
            color: #e2e8f0;
        }

        .btn-volver:hover {
            background-color: #2a4365;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Gustavini</h1>
    </div>

    <div class="contenedor">
        <h2>Editar Prenda</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" value="{{ prenda.nombre }}" required>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" name="descripcion" required>{{ prenda.descripcion }}</textarea>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="disponible" name="disponible" {% if prenda.disponible %}checked{% endif %}>
                <label for="disponible">Prenda disponible en stock</label>
            </div>

            {% if prenda.imagen %}
            <div class="imagen-actual">
                <label>Imagen actual</label>
                <img src="{{ prenda.imagen.url }}" alt="{{ prenda.nombre }}">
            </div>
            {% endif %}

            <div class="form-group">
                <label for="imagen">Cambiar o subir nueva imagen</label>
                <input type="file" id="imagen" name="imagen" accept="image/*">
            </div>
            
            <div class="botones">
                <a href="{% url 'inicio' %}" class="btn btn-volver">Volver al catálogo</a>
                <button type="submit" class="btn btn-guardar">Guardar cambios</button>
            </div>
        </form>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar - Gustavini</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0b1320;
            color: #e2e8f0;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .contenedor {
            background-color: #152238;
            border: 1px solid #1e3150;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.5;
            font-size: 16px;
        }

        .prenda-nombre {
            color: #ffffff;
            font-weight: bold;
            font-size: 18px;
            display: block;
            margin-top: 10px;
        }

        .botones {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s;
            text-transform: uppercase;
        }

        .btn-cancelar {
            background-color: #1e3150;
            color: #e2e8f0;
        }

        .btn-cancelar:hover {
            background-color: #2a4365;
        }

        .btn-eliminar {
            background-color: #e74c3c;
            color: #ffffff;
        }

        .btn-eliminar:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>Gustavini</h1>
        <p>¿Estás seguro de que deseas eliminar permanentemente esta prenda? <span class="prenda-nombre">"{{ prenda.nombre }}"</span></p>
        
        <form method="POST">
            {% csrf_token %}
            <div class="botones">
                <a href="{% url 'inicio' %}" class="btn btn-cancelar">Cancelar</a>
                <button type="submit" class="btn btn-eliminar">Sí, eliminar</button>
            </div>
        </form>
    </div>

</body>
</html>
